name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend test dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

  backend-contract-tests:
    name: Backend contract tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest httpx fastapi python-multipart pillow numpy pydantic

      - name: Run backend contract tests
        run: python -m pytest
