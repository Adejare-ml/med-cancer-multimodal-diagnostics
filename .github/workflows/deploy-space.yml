# Pushes the API in src/ to the Hugging Face Space when a version tag is pushed.
# Needs a repository secret HF_TOKEN with write access to the Space.
# The Space keeps its weight files; this only replaces code, requirements and Dockerfile.
name: Deploy API to Hugging Face Space

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: test -n "$HF_TOKEN" || { echo "HF_TOKEN secret is not set"; exit 1; }
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install huggingface_hub==0.27.0
      - name: Upload src/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi
          api = HfApi()
          api.upload_folder(
              repo_id="AdejareworkStudio/Breast_cancer_predictor",
              repo_type="space",
              folder_path="src",
              allow_patterns=["app/**", "requirements.txt", "Dockerfile", "README.md"],
              delete_patterns=["main.py", "inference.py"],
              commit_message="Deploy Jvision API from GitHub",
          )
          PY
