version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/src"
    schedule:
      interval: "weekly"
    ignore:
      # Pinned to torch==2.3.0 / torchvision==0.18.0 (CPU index) and Python 3.10 in src/Dockerfile
      - dependency-name: "torch"
        versions: [">= 2.4.0"]
      - dependency-name: "torchvision"
        versions: [">= 0.19.0"]
      - dependency-name: "numpy"
        versions: [">= 2.0.0"]
      - dependency-name: "pandas"
        versions: [">= 2.3.0"]
      - dependency-name: "pillow"
        versions: [">= 13.0.0"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
